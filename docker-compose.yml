services:
  main-server:
    build: .
    container_name: main-server
    restart: unless-stopped
    network_mode: "host"
    environment:
      - WHATSAPP_SERVER_URL=http://127.0.0.1:5000
    env_file:
      - .env
    volumes:
      - ./auth_info:/app/auth_info

  whatsapp-server:
    build: ./whatsapp-server
    container_name: whatsapp-server
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - ./auth_info:/app/auth_info
