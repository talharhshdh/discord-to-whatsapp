name: Discord WhatsApp Bridge

on:
  push:
    branches: [main] # Restart bridge on every push to main
  workflow_dispatch: # Allows manual trigger
concurrency:
  group: discord-whatsapp-bridge
  cancel-in-progress: true
# schedule:
#   - cron: "0 */5 * * *" # Fallback every 6h in case the self-trigger fails

# No concurrency limit - allow overlapping runs for graceful handoff
# Each run will naturally end after 5 hours, preventing runaway accumulation

jobs:
  run-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 310 # 5 hours + 10 min buffer for setup/teardown

    steps:
      - name: Check concurrent runs
        run: |
          echo "🔍 Checking for concurrent workflow runs..."
          RUNNING_COUNT=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=100" \
            | jq '[.workflow_runs[] | select(.name == "Discord WhatsApp Bridge")] | length')

          echo "📊 Currently running workflows: $RUNNING_COUNT"

          if [ "$RUNNING_COUNT" -gt 2 ]; then
            echo "⚠️ Too many concurrent runs ($RUNNING_COUNT). Exiting to prevent accumulation."
            exit 1
          fi

          echo "✅ Concurrent run check passed. Proceeding..."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Create auth_info directory
        run: mkdir -p auth_info browser_data

      - name: Restore creds.json from GitHub Secret
        run: |
          echo '${{ secrets.CREDS_JSON }}' > auth_info/creds.json
          echo "✅ creds.json restored"

      - name: Create .env from GitHub Secret
        run: |
          echo '${{ secrets.ENV_FILE }}' > .env
          echo "✅ .env file created"

      - name: Setup AWS CLI for Cloudflare R2
        run: |
          source .env
          aws configure set default.s3.signature_version s3v4
          aws configure set aws_access_key_id ${R2_ACCESS_KEY_ID}
          aws configure set aws_secret_access_key ${R2_SECRET_ACCESS_KEY}
          aws configure set default.region auto

      # - name: Load State from Cloudflare R2
      #   run: |
      #     source .env
      #     echo "📥 Downloading latest state..."
      #     aws s3 cp s3://${R2_BUCKET_NAME}/state.tar.gz state.tar.gz --endpoint-url https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com || echo "No previous state found."
      #     if [ -f "state.tar.gz" ]; then
      #       echo "📦 Extracting state..."
      #       tar -xzf state.tar.gz -C $(pwd) --overwrite || echo "Failed to extract state"
      #     fi

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Install & build dashboard
        run: |
          npm run dashboard:install
          npm run dashboard:build
          echo "✅ Dashboard built (served at same origin as API)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # [DISABLED] Heavy ML/AI deps — uncomment to re-enable
          # pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          # pip install "llama-cpp-python" huggingface_hub accelerate
          # pip install qwen-tts soundfile edge-tts
          # pip install git+https://github.com/myshell-ai/MeloTTS.git
          pip install seleniumbase fastapi uvicorn pydantic rembg onnxruntime python-multipart openai-whisper easyocr
          seleniumbase install chromedriver

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsox-dev
          # [DISABLED] VNC/noVNC stack — uncomment to re-enable
          # sudo apt-get install -y x11vnc xvfb novnc websockify fluxbox

      - name: Start VNC and Tunnel
        run: |
          # [DISABLED] VNC/noVNC stack — uncomment to re-enable
          # Xvfb :99 -screen 0 1280x800x24 &
          # sleep 2
          # fluxbox -display :99 &
          # x11vnc -display :99 -nopw -bg -xkb -forever
          # websockify --web=/usr/share/novnc/ 6080 localhost:5900 &

          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          # Tunnel is spawned by the application code instead of bash

      - name: Start Cloudflare Bypasser API
        run: |
          python src/scripts/cf_bypasser.py > bypasser.log 2>&1 &
          echo "Waiting for API to start..."
          for i in {1..15}; do
            if curl -s http://127.0.0.1:8000/health > /dev/null; then
              echo "✅ API is up!"
              break
            fi
            sleep 2
          done
          # bypasser.log intentionally not printed (avoid leaking startup info)

      # [DISABLED] LLM Server — uncomment to re-enable
      # - name: Start LLM Server
      #   run: |
      #     python src/scripts/llm_server.py > llm_server.log 2>&1 &
      #     echo "Waiting for LLM server to start..."
      #     for i in {1..15}; do
      #       if curl -s http://127.0.0.1:8001/health > /dev/null; then
      #         echo "✅ LLM server is up!"
      #         break
      #       fi
      #       sleep 2
      #     done

      # [DISABLED] TTS Server — uncomment to re-enable
      # - name: Start TTS Server
      #   run: |
      #     python src/scripts/tts_server.py > tts_server.log 2>&1 &
      #     echo "Waiting for TTS server to start..."
      #     for i in {1..15}; do
      #       if curl -s http://127.0.0.1:8002/health > /dev/null; then
      #         echo "✅ TTS server is up!"
      #         break
      #       fi
      #       sleep 2
      #     done

      # - name: Run Auto-Download (Spider-Man)
      #   run: node dist/scripts/auto-download.js

      - name: Run bridge for 5 hours
        run: |
          echo "🚀 Starting Discord WhatsApp Bridge..."

          # Spawn browser workers after 60s (dashboard needs to be up first)
          (sleep 60 && \
            echo "🌐 Spawning browser worker fleet..." && \
            curl -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/browser-worker.yml/dispatches \
              -d '{"ref":"${{ github.ref_name }}"}' && \
            echo "✅ Browser workers dispatched!") &

          # Trigger next workflow 15 minutes BEFORE timeout (runner takes ~12 min to start)
          # IMPORTANT: Backup state FIRST, then trigger — so the new runner always gets fresh data
          (sleep 17100 && \
            # [DISABLED Cloudflare Backup]
            # echo "📦 Pre-trigger backup: archiving state before handoff..." && \
            # sudo tar -czf /tmp/state_pretrigger.tar.gz -C $(pwd) auth_info browser_data && \
            # sudo chmod 666 /tmp/state_pretrigger.tar.gz && \
            # source .env && \
            # echo "📤 Uploading pre-trigger backup to R2..." && \
            # aws s3 cp /tmp/state_pretrigger.tar.gz s3://${R2_BUCKET_NAME}/state.tar.gz \
            #   --endpoint-url https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com && \
            # echo "✅ Pre-trigger backup uploaded! New runner will get fresh state." && \
            echo "⏰ Triggering next workflow run (15 min early for graceful handoff)..." && \
            curl -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bridge.yml/dispatches \
              -d '{"ref":"${{ github.ref_name }}"}' && \
            echo "✅ Next workflow triggered!") &

          # Run the bot for 5 hours (18000 seconds) then stop gracefully
          timeout 18000 npm start; code=$?

          if [ "$code" -eq 124 ]; then
            echo "⏱️ Process cleanly stopped after 5 hours."
          elif [ "$code" -eq 0 ]; then
            echo "✅ Process completed normally."
          else
            echo "❌ Process failed with exit code $code"
          fi
          exit 0 # Ensures the step passes so the trigger step can run

      # - name: Trigger next workflow run
      #   if: always()
      #   run: |
      #     echo "⏰ Triggering next workflow run..."
      #     curl -X POST \
      #       -H "Accept: application/vnd.github+json" \
      #       -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
      #       -H "X-GitHub-Api-Version: 2022-11-28" \
      #       https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bridge.yml/dispatches \
      #       -d '{"ref":"${{ github.ref_name }}"}'
      #     echo "✅ Next workflow triggered!"

      # [DISABLED Cloudflare Backup]
      # - name: Save State to Cloudflare R2
      #   if: always()
      #   run: |
      #     # Safety net: captures the final ~15 minutes of state that ran after the pre-trigger backup.
      #     # The pre-trigger backup (inside "Run bridge") already uploaded a fresh snapshot before
      #     # triggering the next runner, so this step ensures nothing is lost at teardown.
      #     echo "📦 Archiving final state (safety net backup)..."
      #     sudo tar -czf state.tar.gz -C $(pwd) auth_info browser_data || echo "Tar completed with warnings"
      #     sudo chmod 666 state.tar.gz
      # 
      #     source .env
      #     echo "📤 Uploading final state to R2 (overwrites pre-trigger snapshot)..."
      #     aws s3 cp state.tar.gz s3://${R2_BUCKET_NAME}/state.tar.gz --endpoint-url https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
      #     echo "✅ Final state successfully synced to R2."
