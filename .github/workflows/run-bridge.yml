name: Discord WhatsApp Bridge

on:
  push:
    branches: [main] # Restart bridge on every push to main
  workflow_dispatch: # Allows manual trigger
  schedule:
    - cron: "0 */6 * * *" # Fallback every 6h in case the self-trigger fails

concurrency:
  group: discord-whatsapp-bridge
  cancel-in-progress: true # Cancel old run when new push comes in

jobs:
  run-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 310 # 5 hours + 10 min buffer for setup/teardown

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Create auth_info directory
        run: mkdir -p auth_info

      - name: Restore creds.json from GitHub Secret
        run: |
          echo '${{ secrets.CREDS_JSON }}' > auth_info/creds.json
          echo "✅ creds.json restored"

      - name: Create .env from GitHub Secret
        run: |
          echo '${{ secrets.ENV_FILE }}' > .env
          echo "✅ .env file created"

      - name: Setup AWS CLI for Cloudflare R2
        run: |
          aws configure set default.s3.signature_version s3v4
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set default.region auto

      - name: Load State from Cloudflare R2
        run: |
          echo "📥 Downloading latest state..."
          aws s3 cp s3://${{ secrets.R2_BUCKET_NAME }}/state.tar.gz state.tar.gz --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com || echo "No previous state found."
          if [ -f "state.tar.gz" ]; then
            echo "📦 Extracting state..."
            tar -xzf state.tar.gz -C / --overwrite || echo "Failed to extract state"
          fi

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Install & build dashboard
        run: |
          npm run dashboard:install
          npm run dashboard:build
          echo "✅ Dashboard built (served at same origin as API)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase fastapi uvicorn pydantic rembg onnxruntime python-multipart openai-whisper easyocr
          seleniumbase install chromedriver
      - name: Install VNC, FFmpeg, and Android tools
        run: |
          sudo apt-get update
          sudo apt-get install -y x11vnc xvfb novnc websockify fluxbox ffmpeg

      - name: Start VNC and Tunnel
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          fluxbox -display :99 &
          x11vnc -display :99 -nopw -bg -xkb -forever
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &

          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          # Tunnel is spawned by the application code instead of bash

      - name: Start Cloudflare Bypasser API
        env:
          DISPLAY: :99
        run: |
          python src/scripts/cf_bypasser.py > bypasser.log 2>&1 &
          echo "Waiting for API to start..."
          for i in {1..15}; do
            if curl -s http://127.0.0.1:8000/health > /dev/null; then
              echo "✅ API is up!"
              break
            fi
            sleep 2
          done
          cat bypasser.log

      # - name: Run Auto-Download (Spider-Man)
      #   run: node dist/scripts/auto-download.js

      - name: Run bridge for 5 hours
        run: |
          echo "🚀 Starting Discord WhatsApp Bridge..."
          # Run the bot for 5 hours (18000 seconds) then stop gracefully
          timeout 18000 npm start || code=$?

          if [ "$code" -eq 124 ]; then
            echo "⏱️ Process cleanly stopped after 5 hours."
          elif [ -z "$code" ]; then
            echo "✅ Process completed normally."
          else
            echo "❌ Process failed with exit code $code"
          fi
          exit 0 # Ensures the step passes so the trigger step can run

      - name: Save State to Cloudflare R2
        if: always()
        run: |
          echo "📦 Archiving state..."
          mkdir -p ~/.local/share/code-server ~/.config/code-server /home/runner/chromium_data $(pwd)/auth_info
          tar -czf state.tar.gz \
            --exclude='Cache' \
            --exclude='Code Cache' \
            --exclude='GPUCache' \
            --exclude='*.log' \
            --absolute-names \
            ~/.local/share/code-server \
            ~/.config/code-server \
            /home/runner/chromium_data \
            $(pwd)/auth_info
          
          echo "📤 Deleting previous states from R2..."
          aws s3 rm s3://${{ secrets.R2_BUCKET_NAME }}/ --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          
          echo "📤 Uploading new state to R2..."
          aws s3 cp state.tar.gz s3://${{ secrets.R2_BUCKET_NAME }}/state.tar.gz --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          echo "✅ State successfully synced to R2."

      - name: Trigger next workflow run immediately
        run: |
          echo "🔄 Triggering next run via API..."
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bridge.yml/dispatches \
            -d '{"ref":"${{ github.ref_name }}"}'
          echo "✅ Next workflow run triggered successfully!"
